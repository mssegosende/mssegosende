name: stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate stats cards
        run: python3 scripts/stats.py assets/stats
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}
      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats
          git diff --cached --quiet || git commit -m "chore(stats): update stats cards"
          git push
